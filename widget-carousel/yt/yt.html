<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube • Харко</title>

<style>
html,
body{
    margin:0;
    padding:0;
    background:transparent;
}

.youtube-box{
    width:330px;
    height:630px;
    margin:0 auto;
    font-family:Arial,sans-serif;
    position:relative;
    overflow:hidden;
    border-radius:18px;

    background-image:url("fox_harko_youtube_330x630.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    box-shadow:0 10px 30px rgba(0,0,0,.22);
}

.youtube-box::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.35)
    );
    pointer-events:none;
    z-index:1;
}


/* =========================
   ГОЛОВНА КНОПКА
========================= */

.youtube-btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:80%;
    max-width:250px;
    padding:13px 16px;

    font-size:17px;
    font-weight:900;
    letter-spacing:.3px;

    border:2px solid rgba(255,255,255,.95);
    border-radius:12px;

    background:rgba(255,0,0,.82);
    color:#fff;

    cursor:pointer;

    transition:
        background .2s,
        box-shadow .2s,
        transform .2s;

    z-index:3;

    text-shadow:0 2px 5px rgba(0,0,0,.7);

    box-shadow:
        0 0 0 2px rgba(255,0,0,.25),
        0 6px 18px rgba(0,0,0,.40);

    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
}

.youtube-btn:hover{
    background:rgba(255,0,0,.96);
    box-shadow:
        0 0 12px rgba(255,0,0,.7),
        0 7px 18px rgba(0,0,0,.45);
}

.youtube-btn:active{
    transform:translate(-50%,-50%) scale(.98);
}


/* =========================
   ЗАВАНТАЖЕННЯ
========================= */

.youtube-loader{
    display:none;
    position:absolute;
    inset:0;

    justify-content:center;
    align-items:center;
    gap:10px;

    color:#fff;
    background:rgba(0,0,0,.45);

    z-index:4;
}

.youtube-spinner{
    width:24px;
    height:24px;

    border:3px solid rgba(255,255,255,.35);
    border-top-color:#fff;

    border-radius:50%;

    animation:youtube-spin .8s linear infinite;
}

@keyframes youtube-spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   ВНУТРІШНІЙ YOUTUBE-БЛОК
========================= */

.youtube-widget{
    position:absolute;
    inset:0;

    width:330px;
    height:630px;

    box-sizing:border-box;

    /* Нижній відступ потрібен, щоб закріплена кнопка
       не перекривала останній контент. */
    padding:10px 7px 82px;

    overflow-x:hidden;
    overflow-y:auto;

    background:#fff;

    opacity:0;
    visibility:hidden;

    transition:opacity .4s;

    z-index:5;

    scrollbar-width:thin;
}

.youtube-widget.show{
    opacity:1;
    visibility:visible;
}

.youtube-widget iframe{
    display:block;
    margin:0 auto;
    border:0;
}

.youtube-widget p{
    margin:10px 0 7px;
    text-align:center;
    color:#202124;
    font-size:15px;
    font-weight:900;
}

.youtube-widget hr{
    border:0;
    border-top:1px solid #ddd;
    margin:14px 0;
}


/* =========================
   ВЕРХНЯ ЧАСТИНА
========================= */

.youtube-header{
    text-align:center;
    margin-bottom:10px;
}

.youtube-title{
    margin:2px 0 8px;
    font-size:19px;
    font-weight:900;
    color:#111;
}

.youtube-subscribe{
    width:100%;
    display:flex;
    justify-content:center;
    min-height:50px;
    overflow:hidden;
}


/* =========================
   ЗАКРІПЛЕНА НИЖНЯ КНОПКА
========================= */

.youtube-fixed-bottom{
    display:none;

    position:absolute;
    left:0;
    right:0;
    bottom:0;

    box-sizing:border-box;

    padding:10px 14px 12px;

    z-index:7;

    background:linear-gradient(
        to top,
        rgba(255,255,255,1) 68%,
        rgba(255,255,255,.94) 82%,
        rgba(255,255,255,0)
    );

    pointer-events:none;
}

.youtube-fixed-bottom.show{
    display:block;
}

.youtube-channel-link{
    display:flex;

    width:100%;
    height:46px;

    box-sizing:border-box;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#ff0000;
    color:#fff;

    text-decoration:none;

    font-size:15px;
    font-weight:900;

    box-shadow:0 4px 14px rgba(0,0,0,.30);

    transition:
        background .2s,
        transform .2s;

    pointer-events:auto;
}

.youtube-channel-link:hover{
    background:#d90000;
}

.youtube-channel-link:active{
    transform:scale(.98);
}


/* =========================
   SHORTS
========================= */

.sh-wrap{
    width:100%;
    display:flex;
    justify-content:center;
}


/* =========================
   МОБІЛЬНИЙ ЗАХИСТ
========================= */

@media(max-width:330px){

    .youtube-box,
    .youtube-widget{
        width:100vw;
    }

    .youtube-widget iframe.video-player{
        width:calc(100vw - 14px);
    }
}
</style>
</head>

<body>

<div class="youtube-box">

    <button
        id="foxHarkoYoutubeLoadBtn"
        class="youtube-btn"
        type="button"
        aria-controls="foxHarkoYoutubeWidget"
        aria-label="Показати YouTube Харка">
        ▶ Показати YouTube
    </button>


    <div
        id="foxHarkoYoutubeLoader"
        class="youtube-loader">

        <div class="youtube-spinner"></div>
        <span>Завантаження YouTube...</span>

    </div>


    <div
        id="foxHarkoYoutubeWidget"
        class="youtube-widget">
    </div>


    <!-- ЦЯ КНОПКА ЗАВЖДИ ЗАЛИШАЄТЬСЯ ВНИЗУ,
         НАВІТЬ КОЛИ КОНТЕНТ ВСЕРЕДИНІ ГОРТАЄТЬСЯ -->
    <div
        id="foxHarkoYoutubeFixedBottom"
        class="youtube-fixed-bottom">

        <a
            id="foxHarkoYoutubeChannelLink"
            class="youtube-channel-link"
            href="https://www.youtube.com/channel/UCWoKuErHW4Dwex8w-8RgZSA"
            target="_blank"
            rel="noopener noreferrer">
            Відкрити канал Харка на YouTube
        </a>

    </div>

</div>


<script>
(() => {

    const CHANNEL_ID = "UCWoKuErHW4Dwex8w-8RgZSA";

    const UPLOADS_PLAYLIST =
        "UUWoKuErHW4Dwex8w-8RgZSA";

    const POPULAR_PLAYLIST =
        "UULPWoKuErHW4Dwex8w-8RgZSA";

    const SHORTS_PLAYLIST =
        "UUSHWoKuErHW4Dwex8w-8RgZSA";


    let youtubeLoaded = false;


    const button =
        document.getElementById("foxHarkoYoutubeLoadBtn");

    const loader =
        document.getElementById("foxHarkoYoutubeLoader");

    const widget =
        document.getElementById("foxHarkoYoutubeWidget");

    const fixedBottom =
        document.getElementById("foxHarkoYoutubeFixedBottom");


    if (!button || !loader || !widget || !fixedBottom) return;


    function createPlayer(playlistId, title, width, height, extraClass = ""){

        const iframe = document.createElement("iframe");

        iframe.className =
            "video-player " + extraClass;

        iframe.width = String(width);
        iframe.height = String(height);

        iframe.src =
            "https://www.youtube.com/embed/videoseries" +
            "?list=" + encodeURIComponent(playlistId) +
            "&controls=1" +
            "&fs=1" +
            "&rel=0" +
            "&playsinline=1";

        iframe.title = title;
        iframe.frameBorder = "0";

        iframe.allow =
            "accelerometer; autoplay; clipboard-write; " +
            "encrypted-media; gyroscope; picture-in-picture; " +
            "web-share; fullscreen";

        iframe.referrerPolicy =
            "strict-origin-when-cross-origin";

        iframe.allowFullscreen = true;

        return iframe;
    }


    function addSeparator(){
        widget.appendChild(
            document.createElement("hr")
        );
    }


    function addTitle(text){

        const p =
            document.createElement("p");

        p.textContent = text;

        widget.appendChild(p);
    }


    function showWidget(){

        loader.style.display = "none";

        widget.classList.add("show");

        /* Після відкриття YouTube показуємо
           закріплену кнопку внизу. */
        fixedBottom.classList.add("show");

    }


    button.addEventListener("click", function(event){

        event.preventDefault();
        event.stopPropagation();


        if (youtubeLoaded) return;

        youtubeLoaded = true;


        button.style.display = "none";
        loader.style.display = "flex";


        /* =========================
           ЗАГОЛОВОК
        ========================= */

        const header =
            document.createElement("div");

        header.className =
            "youtube-header";


        const title =
            document.createElement("div");

        title.className =
            "youtube-title";

        title.textContent =
            "YouTube • Харко";


        header.appendChild(title);


        /* =========================
           ПІДПИСКА
        ========================= */

        const subscribe =
            document.createElement("div");

        subscribe.className =
            "youtube-subscribe";


        const subscribeIframe =
            document.createElement("iframe");

        subscribeIframe.width = "160";
        subscribeIframe.height = "50";

        let origin = "";

        if (
            window.location.protocol === "http:" ||
            window.location.protocol === "https:"
        ){
            origin =
                "&origin=" +
                encodeURIComponent(window.location.origin);
        }

        subscribeIframe.src =
            "https://www.youtube.com/subscribe_embed" +
            "?usegapi=1" +
            "&channelid=" + encodeURIComponent(CHANNEL_ID) +
            "&layout=full" +
            "&count=default" +
            origin;

        subscribeIframe.title =
            "Підписатися на YouTube канал Харка";

        subscribeIframe.frameBorder = "0";
        subscribeIframe.scrolling = "no";

        subscribeIframe.referrerPolicy =
            "strict-origin-when-cross-origin";


        subscribe.appendChild(
            subscribeIframe
        );

        header.appendChild(
            subscribe
        );

        widget.appendChild(
            header
        );


        /* =========================
           ВСІ ВІДЕО
        ========================= */

        addTitle(
            "Все відео каналу"
        );


        const allVideos =
            createPlayer(
                UPLOADS_PLAYLIST,
                "Всі відео YouTube каналу Харка",
                315,
                177
            );


        widget.appendChild(
            allVideos
        );


        addSeparator();


        /* =========================
           ПОПУЛЯРНІ
        ========================= */

        addTitle(
            "Популярні відео"
        );


        const popularVideos =
            createPlayer(
                POPULAR_PLAYLIST,
                "Популярні відео YouTube каналу Харка",
                315,
                177
            );


        widget.appendChild(
            popularVideos
        );


        addSeparator();


        /* =========================
           SHORTS
        ========================= */

        addTitle(
            "SHORTS"
        );


        const shortsWrap =
            document.createElement("div");

        shortsWrap.className =
            "sh-wrap";


        const shorts =
            createPlayer(
                SHORTS_PLAYLIST,
                "YouTube Shorts каналу Харка",
                275,
                557
            );


        shortsWrap.appendChild(
            shorts
        );

        widget.appendChild(
            shortsWrap
        );


        let shown = false;

        function ready(){

            if (shown) return;

            shown = true;

            showWidget();

        }


        allVideos.addEventListener(
            "load",
            ready,
            { once:true }
        );


        setTimeout(
            ready,
            3500
        );

    });

})();
</script>

</body>
</html>
